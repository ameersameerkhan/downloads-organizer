[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downloads-organizer"
version = "0.2.0"
description = "A small, local-first CLI for organising files by type, detecting duplicates, and generating reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ameer Sameer Khan" }
]
keywords = ["downloads", "file-organizer", "cli", "file-management", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities"
]
dependencies = ["Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
downloads-organizer = "downloads_organizer.cli:main"

[project.urls]
Repository = "https://github.com/ameersameerkhan/downloads-organizer"
Issues = "https://github.com/ameersameerkhan/downloads-organizer/issues"

[tool.setuptools.packages.find]
where = ["src"]
